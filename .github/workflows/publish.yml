name: Publish to npm

# Auto-publishes @muhammadatef/kakashi to npm when a version tag is pushed.
#
# ONE-TIME SETUP (required for this workflow to succeed):
#   1. Generate an npm automation token: https://www.npmjs.com/settings/muhammadatef/tokens
#      Choose "Automation" type — bypasses 2FA for CI publishes.
#   2. Add it to the repo secrets: Settings → Secrets and variables → Actions
#      → New repository secret → NPM_TOKEN.
#   3. Bump the version in package.json + CHANGELOG.md.
#   4. Commit, then:
#        git tag v1.1.0
#        git push origin v1.1.0
#   5. This workflow will trigger, verify the tag matches package.json,
#      run the full test suite, and publish.
#
# The tag → package.json equality check is deliberate: it prevents
# accidental double-publishes when someone re-tags a commit.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry-run (test everything, publish nothing)'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

permissions:
  contents: read
  id-token: write     # required for npm provenance attestation

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    environment: npm-publish

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          scope: '@muhammadatef'

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Run full test suite
        run: npm test

      - name: Verify tag matches package.json version
        if: github.event_name == 'push'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "Tag version:      $TAG_VERSION"
          echo "package.json:     $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match package.json version $PKG_VERSION"
            echo "Bump package.json and re-tag, or delete the tag and start over."
            exit 1
          fi

      - name: Dry-run pack (verify the tarball contents)
        run: |
          npm pack --dry-run
          echo "---"
          echo "The above list must include: bin/, src/, README.md, README.ar.md, CHANGELOG.md, LICENSE"

      - name: Publish to npm (with provenance)
        if: |
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'false')
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summary
        if: always()
        run: |
          echo "### Publish summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** $(node -p 'require(\"./package.json\").version')" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Dry run:** ${{ github.event.inputs.dry_run || 'false (tag push)' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Verify at: https://www.npmjs.com/package/@muhammadatef/kakashi" >> $GITHUB_STEP_SUMMARY
