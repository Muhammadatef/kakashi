name: Deploy adoption dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/dashboard/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble site
        run: |
          # Ship only the dashboard folder plus the two logo assets it links to.
          mkdir -p site
          cp -r docs/dashboard/* site/
          cp logo-64.png logo-256.png site/ 2>/dev/null || true

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # First-run auto-enable so we don't require a manual click in
          # Settings → Pages → "Source: GitHub Actions" before the first
          # deploy. Idempotent — no-op on subsequent runs.
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
